
name: Actualizar tienda Bright Eyes

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bright-eyes-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Descargar web
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Actualizar copia pública desde Sheets
        run: python scripts/sincronizar_catalogo.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
